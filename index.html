<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>just play it</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>just play it</h1>
      <p class="subtitle">paste your links — share the vibe <span class="version">v3.4</span></p>
    </header>

    <main id="input-view">
      <textarea
        id="url-input"
        placeholder="paste your links here — one per line, or all mixed in text&#10;&#10;youtube, spotify, soundcloud — all welcome"
        spellcheck="false"
      ></textarea>
      <button id="generate-btn">generate player</button>
    </main>

    <section id="player-view" class="hidden">
      <button id="share-all-btn">share this playlist</button>

      <div id="share-bar">
        <span id="share-url"></span>
        <button id="copy-btn">copy link</button>
      </div>

      <div id="tracklist"></div>

      <div id="players"></div>

      <button id="back-btn">← new list</button>
    </section>

    <div id="now-playing-bar" class="hidden">
      <button id="prev-btn">&#8592;</button>
      <span id="now-playing-label">01</span>
      <a id="nav-heart" href="#" target="_blank" rel="noopener noreferrer" title="open on platform to save">♡</a>
      <button id="next-btn">&#8594;</button>
      <button id="autoplay-btn" title="toggle autoplay">autoplay: off</button>
    </div>
  </div>

  <script src="https://w.soundcloud.com/player/api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
